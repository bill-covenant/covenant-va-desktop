<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CVA Desktop — Covenant Virtual Assistant Portal for VAs. Track time, manage tasks, communicate with clients, and more.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CVA Desktop">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>CVA Desktop — Covenant VA Portal</title>
  <link rel="manifest" href="manifest.json">

  <!-- Preconnect to backend for faster API calls -->
  <link rel="preconnect" href="https://covenant-va-backend.onrender.com" crossorigin>
  <link rel="dns-prefetch" href="https://covenant-va-backend.onrender.com">

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #1a0a2e;
    }

    /* Loading splash screen */
    .loading-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a0a2e 0%, #2a0a4a 50%, #1a0a2e 100%);
      z-index: 9999;
      transition: opacity 0.3s ease;
    }
    .loading-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    .loading-logo {
      width: 80px;
      height: 80px;
      margin-bottom: 24px;
      animation: pulse 1.5s ease-in-out infinite;
    }
    .loading-text {
      color: rgba(255,255,255,0.8);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .loading-sub {
      color: rgba(255,255,255,0.4);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      margin-top: 8px;
    }
    .loading-spinner {
      width: 32px;
      height: 32px;
      margin-top: 24px;
      border: 3px solid rgba(139, 92, 246, 0.2);
      border-top-color: #8B5CF6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.8; }
    }
  </style>
</head>
<body>
  <!-- Loading screen shown while Flutter initializes -->
  <div id="loading-screen" class="loading-screen">
    <img src="favicon.png" class="loading-logo" alt="">
    <div class="loading-text">Covenant VA</div>
    <div class="loading-sub">Loading your portal...</div>
    <div class="loading-spinner"></div>
  </div>

  <script>
    // Remove loading screen once Flutter is ready
    window.addEventListener('flutter-first-frame', function() {
      var loader = document.getElementById('loading-screen');
      if (loader) {
        loader.classList.add('fade-out');
        setTimeout(function() { loader.remove(); }, 300);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
