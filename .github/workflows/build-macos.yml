name: Build macOS Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.2'
          channel: 'stable'

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Create Firebase options
        run: |
          cat > lib/firebase_options.dart << 'DART_EOF'
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
          import 'package:flutter/foundation.dart'
              show defaultTargetPlatform, kIsWeb, TargetPlatform;

          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform {
              if (kIsWeb) return web;
              switch (defaultTargetPlatform) {
                case TargetPlatform.windows:
                case TargetPlatform.linux:
                case TargetPlatform.macOS:
                  return web;
                default:
                  return web;
              }
            }

            static const FirebaseOptions web = FirebaseOptions(
              apiKey: '${{ secrets.FIREBASE_API_KEY }}',
              authDomain: 'covenant-va-platform.firebaseapp.com',
              projectId: 'covenant-va-platform',
              storageBucket: 'covenant-va-platform.firebasestorage.app',
              messagingSenderId: '906532241820',
              appId: '1:906532241820:web:9c30ed46528dcded5f0859',
            );
          }
          DART_EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Fix macOS deployment target
        run: |
          sed -i '' "s/platform :osx, '10.14'/platform :osx, '10.15'/" macos/Podfile || true
          sed -i '' "s/platform :osx, '10.13'/platform :osx, '10.15'/" macos/Podfile || true

      - name: Build macOS
        run: flutter build macos --release

      - name: Create DMG
        run: |
          APP_PATH="build/macos/Build/Products/Release/covenant_va_desktop.app"
          DMG_NAME="covenant-va-desktop-macos-${{ github.ref_name }}.dmg"

          # Create a temporary directory for DMG contents
          mkdir -p dmg_contents
          cp -R "$APP_PATH" dmg_contents/
          ln -s /Applications dmg_contents/Applications

          # Create DMG
          hdiutil create -volname "Covenant VA Desktop" \
            -srcfolder dmg_contents \
            -ov -format UDZO \
            "$DMG_NAME"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: covenant-va-desktop-macos-${{ github.ref_name }}.dmg
          name: Covenant VA Desktop ${{ github.ref_name }}
          body: |
            ## Covenant VA Desktop ${{ github.ref_name }}

            ### macOS Installation
            1. Download the DMG file below
            2. Open the DMG
            3. Drag Covenant VA Desktop to Applications
            4. Open from Applications (right-click > Open on first launch)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
