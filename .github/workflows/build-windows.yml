name: Build Windows Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.2'
          channel: 'stable'

      - name: Create Firebase options
        shell: bash
        run: |
          cat > lib/firebase_options.dart << 'DART_EOF'
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
          import 'package:flutter/foundation.dart'
              show defaultTargetPlatform, kIsWeb, TargetPlatform;

          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform {
              if (kIsWeb) return web;
              switch (defaultTargetPlatform) {
                case TargetPlatform.windows:
                case TargetPlatform.linux:
                case TargetPlatform.macOS:
                  return web;
                default:
                  return web;
              }
            }

            static const FirebaseOptions web = FirebaseOptions(
              apiKey: '${{ secrets.FIREBASE_API_KEY }}',
              authDomain: 'covenant-va-platform.firebaseapp.com',
              projectId: 'covenant-va-platform',
              storageBucket: 'covenant-va-platform.firebasestorage.app',
              messagingSenderId: '906532241820',
              appId: '1:906532241820:web:9c30ed46528dcded5f0859',
            );
          }
          DART_EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Create ZIP
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath covenant-va-desktop-${{ github.ref_name }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: covenant-va-desktop-${{ github.ref_name }}.zip
          name: Covenant VA Desktop ${{ github.ref_name }}
          body: |
            ## Covenant VA Desktop ${{ github.ref_name }}
            
            ### Installation
            1. Download the ZIP file below
            2. Extract to a folder
            3. Run `covenant_va_desktop.exe`
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}